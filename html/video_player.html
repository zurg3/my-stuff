<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video player</title>
    <link href="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/css/input_cursor.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/js/lib.min.js"></script>
  </head>
  <body>
    <form hidden>
      <p>
        <label for="video_src">Video link</label>
        <input type="url" id="video_src" size="60" autocomplete="off">
        <input type="button" id="open_video_button" value="Open" onclick="open_video()">
      </p>
      <p>
        <label for="file_input">Video file</label>
        <input type="file" id="file_input" accept="video/*">
      </p>
      <p>
        <input type="button" id="clear_input_button" value="Clear" onclick="clear_input()">
      </p>
      <div id="video_controls" hidden>
        <hr>
        <p>
          <pre id="video_info"></pre>
        </p>
        <p>
          <span>Player size</span>
          <br>
          <input type="button" value="0.5" onclick="resize_player(0.5)">
          <input type="button" value="0.75" onclick="resize_player(0.75)">
          <input type="button" value="1" onclick="resize_player(1)">
          <input type="button" value="2" onclick="resize_player(2)">
          <input type="button" value="4" onclick="resize_player(4)">
          <input type="button" value="6" onclick="resize_player(6)">
          <input type="button" value="8" onclick="resize_player(8)">
          <input type="button" value="Fit" onclick="resize_player()">
        </p>
        <p>
          <span>Playback speed</span>
          <br>
          <input type="button" value="0.25" onclick="set_playback_speed(0.25)">
          <input type="button" value="0.5" onclick="set_playback_speed(0.5)">
          <input type="button" value="0.75" onclick="set_playback_speed(0.75)">
          <input type="button" value="1" onclick="set_playback_speed(1)">
          <input type="button" value="1.25" onclick="set_playback_speed(1.25)">
          <input type="button" value="1.5" onclick="set_playback_speed(1.5)">
          <input type="button" value="2" onclick="set_playback_speed(2)">
          <input type="button" value="4" onclick="set_playback_speed(4)">
        </p>
      </div>
    </form>
    <hr>
    <div id="video_player" hidden></div>
    <script src="video_player/main.js"></script>
  </body>
</html>
