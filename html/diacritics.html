<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Replace diacritics</title>
    <link href="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/css/input_cursor.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/js/lib.min.js"></script>
  </head>
  <body>
    <form>
      <h3>Input</h3>
      <p><textarea id="input_text" name="input_text" rows="8" cols="50" oninput="convert_text()"></textarea></p>
      <p><input type="button" id="clear_input_button" value="Clear input" onclick="clear_input()"></p>
      <h3>Output</h3>
      <p id="output_text"></p>
      <p><input type="button" id="clipboard_button" value="Copy output" onclick="copy_text(output_text.innerText)"></p>
    </form>
    <script>
      const {copy_text} = lib;

      const input_text = document.getElementById('input_text');
      const output_text = document.getElementById('output_text');

      function convert_text() {
        output_text.innerText = input_text.value.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      }

      function clear_input() {
        input_text.value = '';
        output_text.innerText = '';
      }
    </script>
  </body>
</html>
