<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio player</title>
    <link href="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/css/input_cursor.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/js/lib.min.js"></script>
    <style>
      audio {
        width: 100%;
      }

      audio:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <form hidden>
      <p>
        <label for="audio_src">Audio link</label>
        <input type="url" id="audio_src" size="60" autocomplete="off">
        <input type="button" id="open_audio_button" value="Open" onclick="open_audio()">
      </p>
      <p>
        <label for="file_input">Audio file</label>
        <input type="file" id="file_input" accept="audio/*">
      </p>
      <p>
        <input type="button" id="clear_input_button" value="Clear" onclick="clear_input()">
      </p>
    </form>
    <hr>
    <div id="audio_player" hidden></div>
    <script src="audio_player/main.js"></script>
  </body>
</html>
