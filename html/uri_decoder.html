<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URI Decoder</title>
    <link href="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/css/input_cursor.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/js/lib.min.js"></script>
  </head>
  <body>
    <form>
      <h2>URI Decoder</h2>
      <h3>Encoded URI</h3>
      <p><input type="text" id="encoded_uri" size="60"></p>
      <p><input type="button" id="decode_uri_button" value="DECODE URI" onclick="decode_uri()"></p>
      <p><input type="button" id="clear_input_button" value="Clear input" onclick="clear_input()"></p>
      <h3>Decoded URI</h3>
      <p id="decoded_uri"></p>
      <p><input type="button" id="clipboard_button" value="Copy" onclick="copy_text(decoded_uri.innerText)"></p>
    </form>
    <script>
      const {copy_text} = lib;

      const encoded_uri = document.getElementById('encoded_uri');
      const decoded_uri = document.getElementById('decoded_uri');

      function decode_uri() {
        decoded_uri.innerText = decodeURI(encoded_uri.value.trim());
      }

      function clear_input() {
        encoded_uri.value = '';
        decoded_uri.innerText = '';
      }
    </script>
  </body>
</html>
