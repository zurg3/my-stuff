<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Matrix calculator</title>
    <link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/zurg3/my-stuff@master/js/lib.min.js"></script>
    <style>
      body {
        font-family: 'Share Tech Mono', monospace;
      }

      .button {
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        width: 200px;
        border: 1px solid rgba(27,31,35,0.2);
        border-radius: 6px;
        color: #24292e;
        background-color: #eff3f6;
        background-image: linear-gradient(-180deg,#fafbfc,#eff3f6 90%);
        padding: 3px 14px;
        line-height: 24px;
        cursor: pointer;
      }

      .button:focus {
        outline: none;
      }

      .button:hover {
        background-image: linear-gradient(-180deg,#d0d0d0,#eff3f6 90%);
      }

      .button:active {
        background-image: linear-gradient(-180deg,#fafbfc,#eff3f6 90%);
      }

      input[type="number"] {
        width: 36px;
      }

      .output_field:focus{
        outline: none;
      }
    </style>
  </head>
  <body>
    <h1>Matrix calculator</h1>
    <div id="input_matrices" hidden>
      <form>
        <p><input type="button" class="button" value="Calculate" onclick="calc_matrix()"></p>
        <p><input type="button" class="button" value="Fill matrices randomly" onclick="fill_matrices()"></p>
        <p><input type="button" class="button" value="Clear input" onclick="clear_input()"></p>
        <p>Matrix size:
          <select id="matrix_size" onchange="change_matrix_size()"></select>
        </p>
        <p><b>Matrix A</b></p>
        <table id="matrix_a" class="matrix" border="0"></table>
        <p>
          <select id="oper">
            <option value="1">+</option>
            <option value="2">-</option>
            <option value="3">*</option>
          </select>
        </p>
        <p><b>Matrix B</b></p>
        <table id="matrix_b" class="matrix" border="0"></table>
      </form>
    </div>
    <p>=</p>
    <div id="output_matrix" hidden>
      <p><b>Matrix C</b></p>
      <table id="matrix_c" class="matrix" border="0"></table>
    </div>
    <script>
      const {random_number} = lib;

      const default_size = 7;

      const matrix_a = document.getElementById('matrix_a');
      const matrix_b = document.getElementById('matrix_b');
      const matrix_c = document.getElementById('matrix_c');

      const matrix_size = document.getElementById('matrix_size');
      const options = document.createDocumentFragment();

      const oper = document.getElementById('oper');

      for (let i = 2; i <= 20; i++) {
        const option = document.createElement('option');

        if (i === default_size) {
          option.selected = true;
          option.setAttribute('selected', '');
        }
        option.value = i;
        option.innerText = `${i}x${i}`;

        options.append(option);
      }

      matrix_size.append(options);

      draw_table(0, default_size);
      draw_table(1, default_size);
      draw_table(2, default_size);

      document.getElementById('input_matrices').hidden = false;
      document.getElementById('output_matrix').hidden = false;

      function draw_table(id, size) {
        const table = document.getElementsByClassName('matrix')[id];
        const is_output_table = table.id === 'matrix_c';
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < size; i++) {
          const row = document.createElement('tr');

          for (let j = 0; j < size; j++) {
            const cell = document.createElement('td');
            const input = document.createElement('input');

            input.type = 'number';
            if (is_output_table) {
              input.className = 'output_field';
              input.readOnly = true;
            }

            cell.append(input);
            row.append(cell);
          }

          fragment.append(row);
        }

        table.append(fragment);
      }

      function calc_matrix() {
        const size = matrix_a.rows.length;

        let empty_fields = 0;

        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            if (!matrix_a.rows[i].cells[j].children[0].value) empty_fields++;
          }
        }

        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            if (!matrix_b.rows[i].cells[j].children[0].value) empty_fields++;
          }
        }

        if (empty_fields === 0) {
          for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
              if (oper.value === '1') {
                const a = matrix_a.rows[i].cells[j].children[0].valueAsNumber;
                const b = matrix_b.rows[i].cells[j].children[0].valueAsNumber;

                matrix_c.rows[i].cells[j].children[0].value = a + b;
              }
              else if (oper.value === '2') {
                const a = matrix_a.rows[i].cells[j].children[0].valueAsNumber;
                const b = matrix_b.rows[i].cells[j].children[0].valueAsNumber;

                matrix_c.rows[i].cells[j].children[0].value = a - b;
              }
              else if (oper.value === '3') {
                let c = 0;

                for (let k = 0; k < size; k++) {
                  const a = matrix_a.rows[i].cells[k].children[0].valueAsNumber;
                  const b = matrix_b.rows[k].cells[j].children[0].valueAsNumber;

                  c += a * b;
                }

                matrix_c.rows[i].cells[j].children[0].value = c;
              }
            }
          }
        }
      }

      function fill_matrices() {
        const inputs = document.querySelectorAll('#matrix_a input, #matrix_b input');

        for (let i = 0; i < inputs.length; i++) {
          inputs[i].value = random_number(1, 9);
        }
      }

      function clear_input() {
        const inputs = document.querySelectorAll('.matrix input');

        for (let i = 0; i < inputs.length; i++) {
          inputs[i].value = '';
        }
      }

      function change_matrix_size() {
        matrix_a.innerHTML = '';
        matrix_b.innerHTML = '';
        matrix_c.innerHTML = '';

        const size = parseInt(matrix_size.value, 10);

        draw_table(0, size);
        draw_table(1, size);
        draw_table(2, size);
      }
    </script>
  </body>
</html>
